name: Check official sources

on:
  schedule:
    - cron: "0 7 * * 1" # every Monday 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: source-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python3 -m pip install --disable-pip-version-check -r requirements-tools.txt

      - name: Run checker
        id: check
        run: |
          python3 check_official_sources.py --update-state | tee report.txt
          {
            echo "report<<EOF"
            cat report.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if grep -q "NEW_ITEMS_FOUND\|SOURCE_CHECK_FAILED" report.txt; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue when new material is found
        if: steps.check.outputs.notify == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync("report.txt", "utf8");
            const title = `New official learning material detected (${new Date().toISOString().slice(0, 10)})`;
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "source-update",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "source-update",
                color: "1D76DB",
                description: "Official source catalog needs review",
              });
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "source-update",
            });
            const body = [
              "The weekly check found official material not yet cataloged, a source page that changed structure, or a catalog link that became unreachable.",
              "",
              "```", report.trim(), "```",
              "",
              "To update: edit the relevant file under `knowledge/`, run `python3 scripts/sync_pack.py`, update `manifest.json`, and run `make check`.",
            ].join("\n");
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["source-update"],
              });
            }

      - name: Persist YouTube state
        run: |
          if [[ -n "$(git status --porcelain -- .github/state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/state.json
            git commit -m "chore: update YouTube video count state"
            git push
          fi
