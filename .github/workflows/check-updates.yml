name: Check official sources

on:
  schedule:
    - cron: "0 7 * * 1" # every Monday 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: source-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python3 -m pip install --disable-pip-version-check -r requirements-tools.txt

      - name: Run checker
        id: check
        run: |
          python3 check_official_sources.py --update-state | tee report.txt
          if grep -q "CATALOG_UPDATE_NEEDED" report.txt; then
            echo "catalog=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -q "SOURCE_CHECK_FAILED" report.txt; then
            echo "broken=true" >> "$GITHUB_OUTPUT"
          fi

      # The mechanical half of a catalog update needs no judgment, so a bot
      # writes it. The curated Italian columns are left as TODO: markers, which
      # validate_pack.py rejects — a pull request adding material therefore
      # stays red until a person writes them. That is the intended gate, not a
      # failure. Retirement-only changes carry no TODO and go green on their own.
      - name: Apply the mechanical catalog changes
        id: apply
        if: steps.check.outputs.catalog == 'true' && steps.check.outputs.broken != 'true'
        run: |
          set +e
          python3 scripts/apply_catalog_updates.py --max-new "${MAX_NEW:-10}" --skip-link-check
          status=$?
          set -e
          if [[ $status -eq 2 ]]; then
            # Refused: a bulk upstream change, or a source it could not read.
            echo "refused=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ $status -ne 0 ]]; then exit $status; fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          MAX_NEW: ${{ vars.CATALOG_MAX_NEW }}

      - name: Open a pull request with the changes
        id: pr
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%Y-%m-%d)
          branch="catalog/sync-$today-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: sync official catalog ($today)"
          git push -u origin "$branch"

          # make check is run here, not left to the Validate workflow: pull
          # requests created with GITHUB_TOKEN do not trigger other workflows.
          set +e
          check_output=$(make check 2>&1)
          check_status=$?
          set -e
          echo "$check_output"
          if [[ $check_status -eq 0 ]]; then
            echo "checks=pass" >> "$GITHUB_OUTPUT"
            body_status="\`make check\` passes."
          else
            echo "checks=fail" >> "$GITHUB_OUTPUT"
            body_status="\`make check\` fails — expected when rows were added. Fill every \`TODO:\` column, then push to this branch."
          fi

          url=$(gh pr create --base main --head "$branch" \
            --title "Catalog sync ($today)" \
            --body "$(printf '%s\n\n%s\n\n%s\n' \
              'Generated by the weekly source check. Only the mechanically derivable fields are filled: title, URL, duration, lesson count, and quiz count come from the source page. Columns needing judgment carry a TODO: marker.' \
              "$body_status" \
              'Retired material is moved to knowledge/claude/retired-sources.md rather than deleted.')")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Opened $url"

      # Level 2, off by default. Set the repository variable CATALOG_AUTOMERGE
      # to "true" to enable. It fires only for changes that need no prose —
      # in practice retirements — because any added row carries a TODO: and
      # make check fails. The diff allowlist is a second, independent gate:
      # a run that somehow touched .github/ or scripts/ never merges itself.
      - name: Merge when nothing needs a human
        if: >-
          vars.CATALOG_AUTOMERGE == 'true' &&
          steps.pr.outputs.checks == 'pass' &&
          steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          allowed='^(knowledge/|plugins/knowledge-pack/skills/[^/]+/references/|manifest\.json$)'
          unexpected=$(git diff --name-only origin/main...HEAD | grep -Ev "$allowed" || true)
          if [[ -n "$unexpected" ]]; then
            echo "Not merging: change touches paths outside the allowlist:"
            echo "$unexpected"
            exit 0
          fi
          gh pr merge "${{ steps.pr.outputs.url }}" --squash --delete-branch
          echo "Merged ${{ steps.pr.outputs.url }}"

      # The two signals are reported separately: a catalog that needs an edit is
      # editorial backlog, a checker that cannot read its sources is a bug. One
      # issue per run per signal, so the current state is always the issue body
      # rather than the last comment on a months-old thread.
      - name: Report findings
        if: steps.apply.outputs.refused == 'true' || steps.check.outputs.broken == 'true'
        uses: actions/github-script@v9
        env:
          CATALOG: ${{ steps.apply.outputs.refused }}
          BROKEN: ${{ steps.check.outputs.broken }}
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync("report.txt", "utf8").trim();
            const today = new Date().toISOString().slice(0, 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };

            const howToFix = [
              "1. Edit the relevant catalog under `knowledge/`.",
              "2. `python3 scripts/render_catalog.py` to rebuild the knowledge-base tables.",
              "3. `python3 scripts/sync_pack.py` to refresh the plugin mirrors.",
              "4. Update the counts and `verified_on` in `manifest.json`.",
              "5. `make check`.",
            ].join("\n");

            const open = async (label, title, intro) => {
              const body = [intro, "", "```", report, "```", "", "### How to close this", howToFix].join("\n");
              const { data: existing } = await github.rest.issues.listForRepo({
                owner, repo, state: "open", labels: label,
              });
              // Supersede the previous run's issue instead of appending to it, so
              // the issue body is always the current state of the catalog.
              for (const issue of existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `Superseded by the ${today} run.`,
                });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
              }
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            };

            if (process.env.CATALOG === "true") {
              await ensureLabel("source-update", "1D76DB", "Official source catalog needs an edit");
              await open(
                "source-update",
                `Catalog update needed (${today})`,
                "The weekly check found a catalog change it would not apply on its own: either more new material than the safety threshold allows, or a source it could not read. A bulk upstream change needs a person to look before the catalog moves.",
              );
            }
            if (process.env.BROKEN === "true") {
              await ensureLabel("checker-broken", "B60205", "The freshness checker could not read a source");
              await open(
                "checker-broken",
                `Source checker cannot read a source (${today})`,
                "The weekly check could not read one of its sources. This is a checker bug, not editorial backlog: until it is fixed the catalog is unmonitored.",
              );
            }

      - name: Persist YouTube state
        run: |
          if [[ -n "$(git status --porcelain -- .github/state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/state.json
            git commit -m "chore: update YouTube video count state"
            git push
          fi
