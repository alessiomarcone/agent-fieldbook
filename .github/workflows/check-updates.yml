name: Check official sources

on:
  schedule:
    - cron: "0 7 * * 1" # every Monday 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install -U yt-dlp

      - name: Run checker
        id: check
        run: |
          python check_official_sources.py | tee report.txt
          {
            echo "report<<EOF"
            cat report.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if grep -q "NEW_ITEMS_FOUND\|PAGE_STRUCTURE_CHANGED" report.txt; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist YouTube state
        run: |
          if ! git diff --quiet .github/state.json 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/state.json
            git commit -m "chore: update YouTube video count state"
            git push
          fi

      - name: Open issue when new material is found
        if: steps.check.outputs.notify == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.check.outputs.report }}`;
            const title = `New official Claude material detected (${new Date().toISOString().slice(0, 10)})`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "source-update",
            });
            const body = [
              "The weekly check found official material not yet cataloged, or a source page that changed structure.",
              "",
              "```", report.trim(), "```",
              "",
              "To update: add the new rows to `courses.csv` / `tutorials.csv`, mirror them in `knowledge-base.md` (root and `skill/claude-power-user/references/`), and bump `manifest.json`.",
            ].join("\n");
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["source-update"],
              });
            }
