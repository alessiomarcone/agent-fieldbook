name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag and manifests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/validate_pack.py
          python3 -m unittest discover -s tests -v
          python3 -c 'import json, os; version=json.load(open("manifest.json"))["version"]; assert os.environ["RELEASE_TAG"] == f"v{version}", f"tag must be v{version}"'

      - name: Build deterministic plugin archive
        run: python3 scripts/package_plugin.py

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --generate-notes --verify-tag
          fi
